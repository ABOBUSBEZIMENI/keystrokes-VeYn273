name: Build Keystrokes

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
 
      - name: Find project folder
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle не найден. Загрузите в репозиторий файлы проекта (build.gradle, settings.gradle, gradle.properties, папку src)."
            ls -R
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Build Keystrokes.jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keystrokes-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/Keystrokes.jar
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keystrokes-build-${{ github.run_number }}
          name: Keystrokes build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/build/libs/Keystrokes.jar
