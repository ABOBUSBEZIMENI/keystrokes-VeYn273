name: Build Keystrokes

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build Keystrokes.jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keystrokes-jar
          path: build/libs/Keystrokes.jar

      # Релиз с готовым jar: его удобно скачать прямо с телефона
      # (вкладка Releases в репозитории)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keystrokes-build-${{ github.run_number }}
          name: Keystrokes build ${{ github.run_number }}
          files: build/libs/Keystrokes.jar
